[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u-discovery"
version = "0.2.0"
description = "Interpretable equation discovery for urban spatiotemporal systems"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "U-Discovery authors"}]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/Graph-WaveNet-LICENSE"]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
train = ["torch>=2.1,<3", "networkx>=3.1,<4", "scikit-learn>=1.3,<2"]
figures = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<9"]
all = ["torch>=2.1,<3", "networkx>=3.1,<4", "scikit-learn>=1.3,<2", "matplotlib>=3.8,<4", "pytest>=8,<9"]

[project.scripts]
udiscovery = "udiscovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
